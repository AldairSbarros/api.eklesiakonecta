version: '3.9'

networks:
  eklesia_new_net: {}

volumes:
  pgdata: {}

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: senha
      POSTGRES_DB: eklesia
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - eklesia_new_net
    restart: unless-stopped

  api:
    build: .
    environment:
      DATABASE_URL: postgresql://postgres:senha@db:5432/eklesia?schema=public
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3200:3000"
    networks:
      - eklesia_new_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/health | grep '"status":"ok"'" ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 25s
