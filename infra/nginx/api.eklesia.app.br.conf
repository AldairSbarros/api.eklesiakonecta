server {
    listen 80;
    server_name api.eklesia.app.br;

    # Redireciona tudo para HTTPS (após emitir certificado)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name api.eklesia.app.br;

    # Certificados gerados pelo certbot
    ssl_certificate /etc/letsencrypt/live/api.eklesia.app.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.eklesia.app.br/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/api.eklesia.app.br/chain.pem;

    # Segurança básica
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy no-referrer-when-downgrade;
    add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' data: http: https:";

    # Ajustar se usar WebSocket no futuro
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    access_log /var/log/nginx/eklesia_access.log;
    error_log  /var/log/nginx/eklesia_error.log;

    # Rate limit opcional (ex: 600 req/min por IP)
    # limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;  # ~600/min

    location / {
        # limit_req zone=api_limit burst=20 nodelay; # descomente para ativar
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /metrics {
        # Opcional: proteger métricas
        # auth_basic "Restricted";
        # auth_basic_user_file /etc/nginx/.htpasswd;
        proxy_pass http://127.0.0.1:3001/metrics;
    }
}
