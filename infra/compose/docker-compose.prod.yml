# (movido) Produção sem proxy (usar Nginx externo)
# docker compose -f infra/compose/docker-compose.prod.yml up -d

version: '3.9'
services:
  api:
    image: ghcr.io/aldairsbarros/api.eklesiakonecta:latest
    container_name: eklesia-api
    env_file:
      - ../../.env
    # Overrides críticos para produção (corrigem loop de restart)
    # Motivo: container estava apontando PGHOST/DATABASE_URL para localhost e não alcançava o serviço postgres
    environment:
      PGHOST: postgres
      # DB principal (confira se o nome correto é eklesia_db). A senha contém '@' que precisa estar URL encoded (%40)
      DATABASE_URL: postgresql://aldai:Riadl%401974@postgres:5432/eklesia_db?schema=public
      PGUSER: aldai
      PGPASSWORD: "Riadl@1974"
      PGDATABASE: eklesia_db
      # Desativar migrations temporariamente até estabilizar (evita loop caso falhe)
      RUN_MIGRATIONS: "false"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3001/api/health/multi-tenancy | grep ', "ok":true'"]
      interval: 30s
      timeout: 8s
      retries: 5
      start_period: 40s
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-senha}
      # Ajuste opcional: alinhar nome do DB se você realmente usa eklesia_db. Se já existe volume inicializado com outro nome, este valor não recria/renomeia.
      POSTGRES_DB: ${POSTGRES_DB:-eklesia_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
networks:
  default: {}
volumes:
  pgdata: {}
  redisdata: {}