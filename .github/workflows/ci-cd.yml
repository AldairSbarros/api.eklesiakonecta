name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: aldairsbarros/api.eklesiakonecta

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/eklesia?schema=public
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: eklesia
        # Healthcheck removido para evitar falhas intermitentes de inicialização; rely no retry implícito da aplicação.
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install deps
        run: npm ci --legacy-peer-deps
      - name: Cache Prisma
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/prisma
            node_modules/.prisma
          key: prisma-${{ hashFiles('prisma/schema.prisma') }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            prisma-${{ hashFiles('prisma/schema.prisma') }}-
      - name: Generate Prisma Client
        run: npx prisma generate
      - name: Wait for Postgres
        shell: bash
        run: |
          echo "Aguardando Postgres ficar disponível..."
          for i in {1..30}; do
            if pg_isready -h postgres -p 5432 -U postgres > /dev/null 2>&1; then
              echo "Postgres está pronto (tentativa $i)."; break; fi
            echo "Tentativa $i ainda não disponível..."; sleep 2;
            if [ $i -eq 30 ]; then echo "Postgres não ficou pronto a tempo"; exit 1; fi
          done
        env:
          PGPASSWORD: password
      - name: Run migrations
        run: npx prisma migrate deploy
      - name: Run tests
        run: npm test -- --runInBand
        env:
          NODE_ENV: test
      - name: Drift check (optional)
        if: env.CHECK_DB_SCHEMA == 'true'
        run: |
          echo "Verificando drift entre schema.prisma e banco..."
          npx prisma migrate diff \
            --from-schema-datamodel prisma/schema.prisma \
            --to-schema-datasource prisma/schema.prisma \
            --exit-code || EXIT_CODE=$?
          # Exit code 2 indica diferenças
          if [ "${EXIT_CODE:-0}" = "2" ]; then
            echo "Drift detectado!"; exit 1; fi
          echo "Sem drift detectado."

  build-and-push:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            cd /caminho/para/api.eklesiakonecta-backend
            git pull origin main
            bash infra/deploy/deploy.sh
