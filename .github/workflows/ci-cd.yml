name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: aldairsbarros/api.eklesiakonecta

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Usar localhost (porta mapeada) para alinhar com testes de disponibilidade e evitar DNS interno ocasionalmente indisponível
      DATABASE_URL: postgresql://postgres:password@localhost:5432/eklesia?schema=public
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: eklesia
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres" --health-interval=5s --health-timeout=5s --health-retries=10
        # Healthcheck removido para evitar falhas intermitentes de inicialização; rely no retry implícito da aplicação.
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install deps
        run: npm ci --legacy-peer-deps
      - name: Cache Prisma
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/prisma
            node_modules/.prisma
          key: prisma-${{ hashFiles('prisma/schema.prisma') }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            prisma-${{ hashFiles('prisma/schema.prisma') }}-
      - name: Generate Prisma Client
        run: npx prisma generate
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Wait for Postgres (robusto + health)
        shell: bash
        env:
          PGPASSWORD: password
        run: |
          echo "Aguardando Postgres via healthcheck + conexão (até ~90s)..."
          for i in {1..45}; do
            CID=$(docker ps --filter 'name=postgres' --format '{{.ID}}')
            STATUS=$(docker inspect --format='{{json .State.Health.Status}}' "$CID" 2>/dev/null || echo 'null')
            # Primeiro tenta health, depois conexão ao DB alvo 'eklesia'
            if [ "$STATUS" = '"healthy"' ]; then
              if psql "postgresql://postgres:password@localhost:5432/eklesia" -c 'select 1' >/dev/null 2>&1; then
                echo "Healthcheck + query OK (tentativa $i)."; READY=1; break;
              fi
            fi
            # fallback tenta query mesmo sem healthy (às vezes health ainda não atualizou)
            if psql "postgresql://postgres:password@localhost:5432/eklesia" -c 'select 1' >/dev/null 2>&1; then
              echo "Query OK (sem health=healthy ainda) tentativa $i."; READY=1; break;
            fi
            echo "[$i] health=$STATUS aguardando..."; sleep 2;
          done
          if [ -z "${READY:-}" ]; then
            echo "Postgres não saudável a tempo. Logs (últimas 100 linhas):";
            docker ps -a;
            docker logs --tail 100 $(docker ps -a --filter 'name=postgres' --format '{{.ID}}') || true;
            echo "Tentando uma última conexão direta antes de falhar...";
            set -x; psql "postgresql://postgres:password@localhost:5432/eklesia" -c 'select 1'; RC=$?; set +x;
            exit ${RC:-1};
          fi
      - name: Run migrations
        run: npx prisma migrate deploy
      - name: Run tests
        run: npm test -- --runInBand
        env:
          NODE_ENV: test
      - name: Drift check (optional)
        if: env.CHECK_DB_SCHEMA == 'true'
        run: |
          echo "Verificando drift entre schema.prisma e banco..."
          npx prisma migrate diff \
            --from-schema-datamodel prisma/schema.prisma \
            --to-schema-datasource prisma/schema.prisma \
            --exit-code || EXIT_CODE=$?
          # Exit code 2 indica diferenças
          if [ "${EXIT_CODE:-0}" = "2" ]; then
            echo "Drift detectado!"; exit 1; fi
          echo "Sem drift detectado."

  build-and-push:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verificar secrets necessários
        id: secrets_check
        run: |
          MISSING=0
          if [ -z "${{ secrets.DEPLOY_HOST }}" ]; then
            echo "Secret DEPLOY_HOST ausente"; MISSING=1; fi
          if [ -z "${{ secrets.DEPLOY_USER }}" ]; then
            echo "Secret DEPLOY_USER ausente"; MISSING=1; fi
          if [ -z "${{ secrets.DEPLOY_KEY }}" ]; then
            echo "Secret DEPLOY_KEY ausente"; MISSING=1; fi
          echo "missing=$MISSING" >> $GITHUB_OUTPUT
      - name: Pular deploy (se secrets ausentes)
        if: steps.secrets_check.outputs.missing == '1'
        run: echo "Secrets de deploy incompletos. Pulando etapa de deploy." && exit 0
      - name: Deploy via SSH
        if: steps.secrets_check.outputs.missing == '0'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST || '' }}
          username: ${{ secrets.DEPLOY_USER || '' }}
          key: ${{ secrets.DEPLOY_KEY || '' }}
          script: |
            cd /caminho/para/api.eklesiakonecta-backend
            git pull origin main
            bash infra/deploy/deploy.sh
