version: '3.9'

# Stack de produção com proxy HTTPS automático via Caddy.
# Uso:
# 1. Defina no .env: API_DOMAIN=api.seu-dominio.com LETSENCRYPT_EMAIL=seu@email.com
# 2. docker compose -f docker-compose.proxy.yml up -d
# 3. Acesse https://api.seu-dominio.com/api/health/multi-tenancy
#
# Certificados são salvos em volume (caddy_data) e persistem entre recriações.
# Logs/estado de config em caddy_config.
#
# Para renovar imagem da API: docker compose -f docker-compose.proxy.yml pull api && docker compose -f docker-compose.proxy.yml up -d api

services:
  api:
    image: ghcr.io/aldairsbarros/api.eklesiakonecta:latest
    container_name: eklesia-api
    env_file: .env
    restart: unless-stopped
    expose:
      - "3001" # exposto somente para rede interna (proxy acessa)
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - eklesia-net

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-senha}
      POSTGRES_DB: ${POSTGRES_DB:-eklesia}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - eklesia-net

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - eklesia-net

  caddy:
    image: caddy:2-alpine
    container_name: eklesia-proxy
    restart: unless-stopped
    environment:
      API_DOMAIN: ${API_DOMAIN}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - api
    networks:
      - eklesia-net

networks:
  eklesia-net: {}

volumes:
  pgdata: {}
  redisdata: {}
  caddy_data: {}
  caddy_config: {}
