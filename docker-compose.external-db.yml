## Compose usando Postgres EXTERNO (rede compartilhada) + build local da API
## Passos:
## 1. docker network create eklesia-net (se não existir)
## 2. Conectar container do Postgres externo: docker network connect eklesia-net <nome_container_postgres>
## 3. Ajustar .env -> DATABASE_URL=postgresql://user:senha@postgres:5432/eklesia?schema=public
## 4. Subir: docker compose -f docker-compose.external-db.yml up -d --build
## 5. Escalar: docker compose -f docker-compose.external-db.yml up -d --scale api=2

services:
  api:
    build: .
    image: eklesia-api:latest
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      RUN_SEED: ${RUN_SEED:-false}
    ports:
      - "3001:3001"
    restart: unless-stopped
    networks: [eklesia-net]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3001/api/health/multi-tenancy | grep '"ok":true'"]
      interval: 30s
      timeout: 8s
      retries: 5
      start_period: 40s

networks:
  eklesia-net:
    external: true
