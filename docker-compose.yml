version: '3.9'

x-net-defaults: &net-defaults
  networks: [eklesia-net]

services:
  # Serviço opcional Postgres local (habilite descomentando ou use compose.external-db)
  # postgres:
  #   image: postgres:16
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_USER: ${POSTGRES_USER:-postgres}
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-senha}
  #     POSTGRES_DB: ${POSTGRES_DB:-eklesia}
  #   healthcheck:
  #     test: ["CMD-SHELL","pg_isready -U $$POSTGRES_USER"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #   volumes:
  #     - pgdata:/var/lib/postgresql/data
  #   <<: *net-defaults

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    <<: *net-defaults

  api:
    build:
      context: .
    image: eklesia-api:dev
    environment:
      NODE_ENV: development
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      RUN_SEED: ${RUN_SEED:-false}
      TENANT_RATE_LIMIT: ${TENANT_RATE_LIMIT:-600}
    depends_on:
      - redis
      # - postgres
    ports:
      - "3001:3001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3001/api/health/multi-tenancy | grep '"ok":true'"]
      interval: 30s
      timeout: 8s
      retries: 5
      start_period: 40s
    <<: *net-defaults

networks:
  eklesia-net: {}

volumes:
  pgdata: {}
